<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake</title>
<style>
  body { margin: 0; padding: 0; background-color: #111; color: #0f0; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; font-family: monospace; }
  canvas { border: 2px solid #333; background-color: #000; box-shadow: 0 0 20px rgba(0, 255, 0, 0.2); }
  #score { font-size: 24px; margin-bottom: 10px; }
</style>
</head>
<body>
  <div id="score">Score: 0</div>
  <canvas id="gameCanvas" width="400" height="400"></canvas>
  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const gridSize = 20;
    let snake = [{x: 200, y: 200}];
    let food = {x: 100, y: 100};
    let dx = 0;
    let dy = -gridSize;
    let score = 0;
    let gameLoop;

    function randomFood() {
      food.x = Math.floor(Math.random() * (canvas.width / gridSize)) * gridSize;
      food.y = Math.floor(Math.random() * (canvas.height / gridSize)) * gridSize;
    }

    function drawRect(x, y, color) {
      ctx.fillStyle = color;
      ctx.fillRect(x, y, gridSize - 2, gridSize - 2);
    }

    function update() {
      const head = {x: snake[0].x + dx, y: snake[0].y + dy};

      if (head.x < 0 || head.x >= canvas.width || head.y < 0 || head.y >= canvas.height || snake.some(s => s.x === head.x && s.y === head.y)) {
        clearInterval(gameLoop);
        alert('Game Over! Score: ' + score);
        document.location.reload();
        return;
      }

      snake.unshift(head);

      if (head.x === food.x && head.y === food.y) {
        score += 10;
        document.getElementById('score').innerText = 'Score: ' + score;
        randomFood();
      } else {
        snake.pop();
      }

      ctx.clearRect(0, 0, canvas.width, canvas.height);
      drawRect(food.x, food.y, 'red');
      snake.forEach((s, i) => drawRect(s.x, s.y, i === 0 ? '#0f0' : '#0a0'));
    }

    document.addEventListener('keydown', e => {
      if (e.key === 'ArrowUp' && dy === 0) { dx = 0; dy = -gridSize; }
      else if (e.key === 'ArrowDown' && dy === 0) { dx = 0; dy = gridSize; }
      else if (e.key === 'ArrowLeft' && dx === 0) { dx = -gridSize; dy = 0; }
      else if (e.key === 'ArrowRight' && dx === 0) { dx = gridSize; dy = 0; }
    });

    randomFood();
    gameLoop = setInterval(update, 100);
  </script>
</body>
</html>
