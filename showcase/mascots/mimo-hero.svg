<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 840" fill="none">
  <defs>
    <linearGradient id="mh" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffb7d5"/>
      <stop offset="100%" stop-color="#ff6eb4"/>
    </linearGradient>
    <linearGradient id="ms" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#c77dff"/>
      <stop offset="100%" stop-color="#ff6eb4"/>
    </linearGradient>
    <linearGradient id="mh2" x1="0.3" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#ffccee"/>
      <stop offset="50%" stop-color="#ff9ed2"/>
      <stop offset="100%" stop-color="#ff6eb4"/>
    </linearGradient>
    <linearGradient id="hoodie" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a1228"/>
      <stop offset="100%" stop-color="#1a0a14"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.3" r="0.6">
      <stop offset="0%" stop-color="#ff6eb4" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ff6eb4" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft">
      <feGaussianBlur stdDeviation="1.5"/>
    </filter>
  </defs>

  <!-- Background glow -->
  <ellipse cx="420" cy="380" rx="300" ry="350" fill="url(#glow)"/>

  <!-- Hair (back layer) -->
  <path d="M280 280c-30-80-20-200 60-240s180-20 220 40c30 45 30 120 20 180l-20 120c-10 40-40 60-80 60h-120c-40 0-60-20-70-60z" fill="url(#mh2)" opacity="0.85"/>

  <!-- Neck -->
  <rect x="390" y="380" width="60" height="50" rx="12" fill="#ffe0f0"/>

  <!-- Hoodie body -->
  <path d="M300 420c-20 10-40 40-40 80v180c0 30 20 50 50 50h260c30 0 50-20 50-50V500c0-40-20-70-40-80l-60-20c-20-5-40-8-60-8h-80c-20 0-40 3-60 8z" fill="url(#hoodie)"/>

  <!-- Hoodie sakura accent stripe -->
  <path d="M350 430c20-5 50-8 70-8h0c20 0 50 3 70 8l40 12c10 5 20 15 20 30v40H310v-40c0-15 10-25 20-30z" fill="#ff6eb4" opacity="0.15"/>

  <!-- A+ logo on hoodie -->
  <text x="420" y="560" text-anchor="middle" font-family="M PLUS Rounded 1c,sans-serif" font-size="60" font-weight="900" fill="#ff6eb4" opacity="0.7">A+</text>

  <!-- Face -->
  <ellipse cx="420" cy="310" rx="90" ry="100" fill="#ffe0f0"/>

  <!-- Blush -->
  <ellipse cx="365" cy="330" rx="22" ry="12" fill="#ff9ed2" opacity="0.4"/>
  <ellipse cx="475" cy="330" rx="22" ry="12" fill="#ff9ed2" opacity="0.4"/>

  <!-- Eyes -->
  <ellipse cx="390" cy="300" rx="18" ry="22" fill="#2a1228"/>
  <ellipse cx="450" cy="300" rx="18" ry="22" fill="#2a1228"/>
  <!-- Eye highlights -->
  <ellipse cx="396" cy="292" rx="7" ry="9" fill="#fff"/>
  <ellipse cx="456" cy="292" rx="7" ry="9" fill="#fff"/>
  <ellipse cx="386" cy="305" rx="4" ry="5" fill="#fff" opacity="0.6"/>
  <ellipse cx="446" cy="305" rx="4" ry="5" fill="#fff" opacity="0.6"/>

  <!-- Eyebrows -->
  <path d="M370 270c5-8 20-12 30-6" stroke="#2a1228" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M440 264c10-6 25-2 30 6" stroke="#2a1228" stroke-width="3" stroke-linecap="round" fill="none"/>

  <!-- Wink eye (right) — closed arc -->
  <path d="M440 300c8-4 16-4 24 0" stroke="#2a1228" stroke-width="3.5" stroke-linecap="round" fill="none"/>

  <!-- Mouth (small smile) -->
  <path d="M408 345c6 8 18 8 24 0" stroke="#d4508a" stroke-width="2.5" stroke-linecap="round" fill="none"/>

  <!-- Nose -->
  <path d="M418 325c2 3 4 3 6 0" stroke="#e8a0c0" stroke-width="1.5" stroke-linecap="round" fill="none"/>

  <!-- Hair (front bangs) -->
  <path d="M310 280c10-90 40-160 110-190s120-10 150 30c15 20 20 50 20 80l-30 60c-20 30-50 40-80 40h-100c-30 0-50-10-70-20z" fill="url(#mh)"/>
  <!-- Bangs detail strands -->
  <path d="M340 260c5-50 20-100 60-130" stroke="#ffccee" stroke-width="2" opacity="0.5" fill="none"/>
  <path d="M400 230c0-40 10-80 40-110" stroke="#ffccee" stroke-width="2" opacity="0.4" fill="none"/>
  <path d="M470 240c-5-30 0-60 20-90" stroke="#ffccee" stroke-width="2" opacity="0.4" fill="none"/>

  <!-- Side hair strands -->
  <path d="M300 290c-20 40-30 120-20 180" stroke="url(#mh)" stroke-width="30" stroke-linecap="round" fill="none"/>
  <path d="M540 290c20 40 30 120 20 180" stroke="url(#mh)" stroke-width="30" stroke-linecap="round" fill="none"/>

  <!-- Sakura hair clip -->
  <g transform="translate(530,240) scale(0.8)">
    <circle cx="0" cy="0" r="18" fill="#ff6eb4"/>
    <circle cx="0" cy="0" r="12" fill="#ffb7d5"/>
    <circle cx="0" cy="0" r="5" fill="#fff" opacity="0.6"/>
    <!-- Petals -->
    <ellipse cx="0" cy="-16" rx="6" ry="10" fill="#ff9ed2" opacity="0.8"/>
    <ellipse cx="14" cy="-7" rx="6" ry="10" fill="#ff9ed2" opacity="0.7" transform="rotate(72)"/>
    <ellipse cx="9" cy="12" rx="6" ry="10" fill="#ff9ed2" opacity="0.7" transform="rotate(144)"/>
    <ellipse cx="-9" cy="12" rx="6" ry="10" fill="#ff9ed2" opacity="0.7" transform="rotate(216)"/>
    <ellipse cx="-14" cy="-7" rx="6" ry="10" fill="#ff9ed2" opacity="0.7" transform="rotate(288)"/>
  </g>

  <!-- Arms (simplified) -->
  <path d="M300 440c-30 20-50 60-40 100" stroke="#ffe0f0" stroke-width="24" stroke-linecap="round" fill="none"/>
  <path d="M540 440c30 20 50 60 40 100" stroke="#ffe0f0" stroke-width="24" stroke-linecap="round" fill="none"/>

  <!-- Waving hand -->
  <g transform="translate(580,530) rotate(-15)">
    <ellipse cx="0" cy="0" rx="18" ry="22" fill="#ffe0f0"/>
    <!-- Fingers -->
    <rect x="-10" y="-28" width="7" height="18" rx="3" fill="#ffe0f0" transform="rotate(-10)"/>
    <rect x="-1" y="-32" width="7" height="22" rx="3" fill="#ffe0f0"/>
    <rect x="8" y="-30" width="7" height="20" rx="3" fill="#ffe0f0" transform="rotate(10)"/>
    <rect x="16" y="-24" width="6" height="16" rx="3" fill="#ffe0f0" transform="rotate(20)"/>
  </g>

  <!-- Sparkle stars around character -->
  <g fill="#ffb7d5" opacity="0.7">
    <path d="M160 200l4 8 8 4-8 4-4 8-4-8-8-4 8-4z"/>
    <path d="M680 180l3 6 6 3-6 3-3 6-3-6-6-3 6-3z"/>
    <path d="M180 500l3 6 6 3-6 3-3 6-3-6-6-3 6-3z"/>
    <path d="M660 480l2.5 5 5 2.5-5 2.5-2.5 5-2.5-5-5-2.5 5-2.5z"/>
    <path d="M420 100l2 4 4 2-4 2-2 4-2-4-4-2 4-2z"/>
  </g>

  <!-- Sakura petals floating -->
  <g fill="#ff9ed2" opacity="0.35">
    <ellipse cx="200" cy="350" rx="8" ry="5" transform="rotate(30 200 350)"/>
    <ellipse cx="640" cy="320" rx="7" ry="4" transform="rotate(-20 640 320)"/>
    <ellipse cx="300" cy="150" rx="6" ry="4" transform="rotate(45 300 150)"/>
    <ellipse cx="550" cy="600" rx="8" ry="5" transform="rotate(-35 550 600)"/>
  </g>
</svg>
