<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 520" fill="none">
  <defs>
    <linearGradient id="ph" x1="0.3" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#7dffb8"/>
      <stop offset="50%" stop-color="#ffb7d5"/>
      <stop offset="100%" stop-color="#ff6eb4"/>
    </linearGradient>
    <linearGradient id="pt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a1228"/>
      <stop offset="100%" stop-color="#1a0a14"/>
    </linearGradient>
  </defs>

  <!-- Glow -->
  <ellipse cx="200" cy="240" rx="150" ry="200" fill="#7dffb8" opacity="0.06"/>

  <!-- Body (overalls) -->
  <path d="M130 300c-15 5-30 30-30 65v90c0 15 12 25 25 25h150c13 0 25-10 25-25v-90c0-35-15-60-30-65l-25-8h-90z" fill="url(#pt)"/>
  <!-- Overall pocket -->
  <rect x="170" y="350" width="60" height="45" rx="8" fill="#2a1228" stroke="#7dffb8" stroke-width="1.5" opacity="0.6"/>
  <!-- Block pattern on overalls -->
  <rect x="150" y="320" width="12" height="12" rx="2" fill="#7dffb8" opacity="0.2"/>
  <rect x="168" y="320" width="12" height="12" rx="2" fill="#ff6eb4" opacity="0.2"/>
  <rect x="186" y="320" width="12" height="12" rx="2" fill="#c77dff" opacity="0.2"/>
  <rect x="220" y="320" width="12" height="12" rx="2" fill="#7dffb8" opacity="0.2"/>
  <rect x="238" y="320" width="12" height="12" rx="2" fill="#ff6eb4" opacity="0.2"/>

  <!-- Neck -->
  <rect x="180" y="260" width="40" height="40" rx="10" fill="#ffe0f0"/>

  <!-- Face -->
  <ellipse cx="200" cy="200" rx="62" ry="68" fill="#ffe0f0"/>

  <!-- Eyes (cheerful, sparkly) -->
  <ellipse cx="178" cy="195" rx="13" ry="15" fill="#2a1228"/>
  <ellipse cx="222" cy="195" rx="13" ry="15" fill="#2a1228"/>
  <ellipse cx="182" cy="188" rx="5" ry="7" fill="#fff"/>
  <ellipse cx="226" cy="188" rx="5" ry="7" fill="#fff"/>
  <ellipse cx="175" cy="199" rx="3" ry="4" fill="#7dffb8" opacity="0.5"/>
  <ellipse cx="219" cy="199" rx="3" ry="4" fill="#7dffb8" opacity="0.5"/>

  <!-- Happy eyebrows -->
  <path d="M160 175c5-4 18-5 28 0" stroke="#2a1228" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M212 175c10-5 23-4 28 0" stroke="#2a1228" stroke-width="2.5" stroke-linecap="round" fill="none"/>

  <!-- Big smile -->
  <path d="M180 222c8 10 32 10 40 0" stroke="#d4508a" stroke-width="2.5" stroke-linecap="round" fill="none"/>

  <!-- Blush -->
  <ellipse cx="155" cy="212" rx="14" ry="8" fill="#ff9ed2" opacity="0.35"/>
  <ellipse cx="245" cy="212" rx="14" ry="8" fill="#ff9ed2" opacity="0.35"/>

  <!-- Hair with voxel/block clips -->
  <path d="M130 180c5-60 30-100 70-110s70 10 75 50c3 20 0 50-10 70l-20 20c-10 10-25 15-40 15h-50c-20 0-30-5-40-15z" fill="url(#ph)"/>
  <path d="M130 185c-10 25-15 65-10 95" stroke="url(#ph)" stroke-width="16" stroke-linecap="round" fill="none"/>
  <path d="M270 185c10 25 15 65 10 95" stroke="url(#ph)" stroke-width="16" stroke-linecap="round" fill="none"/>

  <!-- Voxel block hair clips -->
  <g transform="translate(270,140)">
    <rect x="-10" y="-10" width="20" height="20" rx="3" fill="#7dffb8" stroke="#2a1228" stroke-width="1.5"/>
    <rect x="-6" y="-6" width="12" height="12" rx="2" fill="#fff" opacity="0.3"/>
  </g>
  <g transform="translate(290,165)">
    <rect x="-8" y="-8" width="16" height="16" rx="2" fill="#ff6eb4" stroke="#2a1228" stroke-width="1.5"/>
    <rect x="-4" y="-4" width="8" height="8" rx="1" fill="#fff" opacity="0.3"/>
  </g>

  <!-- Hands holding a block -->
  <g transform="translate(200,430)">
    <rect x="-20" y="-15" width="40" height="40" rx="4" fill="#7dffb8" opacity="0.6" stroke="#2a1228" stroke-width="2"/>
    <rect x="-12" y="-7" width="24" height="24" rx="2" fill="#fff" opacity="0.2"/>
    <!-- Grid lines on block -->
    <line x1="-20" y1="5" x2="20" y2="5" stroke="#2a1228" stroke-width="0.8" opacity="0.3"/>
    <line x1="0" y1="-15" x2="0" y2="25" stroke="#2a1228" stroke-width="0.8" opacity="0.3"/>
  </g>

  <!-- Arms -->
  <path d="M130 310c-20 15-35 40-30 60" stroke="#ffe0f0" stroke-width="18" stroke-linecap="round" fill="none"/>
  <path d="M270 310c20 15 35 40 30 60" stroke="#ffe0f0" stroke-width="18" stroke-linecap="round" fill="none"/>

  <!-- Sparkles -->
  <g fill="#7dffb8" opacity="0.5">
    <path d="M60 120l3 6 6 3-6 3-3 6-3-6-6-3 6-3z"/>
    <path d="M340 100l2 4 4 2-4 2-2 4-2-4-4-2 4-2z"/>
    <path d="M300 400l2.5 5 5 2.5-5 2.5-2.5 5-2.5-5-5-2.5 5-2.5z"/>
  </g>

  <!-- Floating blocks -->
  <g opacity="0.3">
    <rect x="60" y="350" width="16" height="16" rx="2" fill="#7dffb8" transform="rotate(15 68 358)"/>
    <rect x="320" y="380" width="12" height="12" rx="2" fill="#ff6eb4" transform="rotate(-10 326 386)"/>
    <rect x="80" y="200" width="10" height="10" rx="2" fill="#c77dff" transform="rotate(25 85 205)"/>
  </g>
</svg>
