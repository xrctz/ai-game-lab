<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 520" fill="none">
  <defs>
    <linearGradient id="nh" x1="0.3" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#c77dff"/>
      <stop offset="100%" stop-color="#ff6eb4"/>
    </linearGradient>
    <linearGradient id="nt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a1228"/>
      <stop offset="100%" stop-color="#1a0a14"/>
    </linearGradient>
  </defs>

  <!-- Glow -->
  <ellipse cx="200" cy="240" rx="150" ry="200" fill="#ff6eb4" opacity="0.08"/>

  <!-- Body (tactical jacket) -->
  <path d="M130 300c-15 5-30 30-30 65v90c0 15 12 25 25 25h150c13 0 25-10 25-25v-90c0-35-15-60-30-65l-25-8h-90z" fill="url(#nt)"/>
  <!-- Tactical vest lines -->
  <path d="M150 310v130" stroke="#ff6eb4" stroke-width="1.5" opacity="0.3"/>
  <path d="M250 310v130" stroke="#ff6eb4" stroke-width="1.5" opacity="0.3"/>
  <path d="M150 370h100" stroke="#ff6eb4" stroke-width="1.5" opacity="0.2"/>

  <!-- Neck -->
  <rect x="180" y="260" width="40" height="40" rx="10" fill="#ffe0f0"/>

  <!-- Face -->
  <ellipse cx="200" cy="200" rx="65" ry="72" fill="#ffe0f0"/>

  <!-- Cat ears -->
  <path d="M130 170l-20-50 35 25z" fill="#c77dff"/>
  <path d="M270 170l20-50-35 25z" fill="#c77dff"/>
  <path d="M135 168l-15-35 25 18z" fill="#ffb7d5"/>
  <path d="M265 168l15-35-25 18z" fill="#ffb7d5"/>

  <!-- Headset -->
  <path d="M130 195c-5-35 15-65 70-65s75 30 70 65" stroke="#2a1228" stroke-width="8" fill="none"/>
  <rect x="118" y="188" width="20" height="35" rx="8" fill="#2a1228"/>
  <rect x="262" y="188" width="20" height="35" rx="8" fill="#2a1228"/>
  <!-- Headset mic -->
  <path d="M270 220c10 5 15 15 12 25" stroke="#2a1228" stroke-width="4" stroke-linecap="round" fill="none"/>
  <circle cx="280" cy="248" r="6" fill="#ff6eb4"/>

  <!-- Eyes (determined) -->
  <ellipse cx="178" cy="195" rx="14" ry="16" fill="#2a1228"/>
  <ellipse cx="222" cy="195" rx="14" ry="16" fill="#2a1228"/>
  <ellipse cx="182" cy="189" rx="5" ry="7" fill="#fff"/>
  <ellipse cx="226" cy="189" rx="5" ry="7" fill="#fff"/>

  <!-- Eyebrows (focused) -->
  <path d="M160 172c5-6 18-8 28-4" stroke="#2a1228" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <path d="M212 168c10-4 23-2 28 4" stroke="#2a1228" stroke-width="2.5" stroke-linecap="round" fill="none"/>

  <!-- Confident smile -->
  <path d="M186 225c6 6 22 6 28 0" stroke="#d4508a" stroke-width="2" stroke-linecap="round" fill="none"/>

  <!-- Blush -->
  <ellipse cx="158" cy="215" rx="14" ry="8" fill="#ff9ed2" opacity="0.35"/>
  <ellipse cx="242" cy="215" rx="14" ry="8" fill="#ff9ed2" opacity="0.35"/>

  <!-- Hair (violet bob) -->
  <path d="M125 180c5-60 30-100 75-110s75 10 80 50c3 20 0 50-10 70l-20 20c-10 10-25 15-40 15h-50c-20 0-30-5-40-15z" fill="url(#nh)"/>
  <path d="M125 185c-10 25-15 65-10 95" stroke="url(#nh)" stroke-width="18" stroke-linecap="round" fill="none"/>
  <path d="M275 185c10 25 15 65 10 95" stroke="url(#nh)" stroke-width="18" stroke-linecap="round" fill="none"/>

  <!-- Controller in hands -->
  <g transform="translate(200,420)">
    <rect x="-50" y="-12" width="100" height="24" rx="10" fill="#2a1228" stroke="#ff6eb4" stroke-width="1.5"/>
    <circle cx="-25" cy="-2" r="5" fill="#c77dff"/>
    <circle cx="25" cy="-2" r="5" fill="#ff6eb4"/>
    <rect x="-8" y="-8" width="16" height="6" rx="2" fill="#ffb7d5" opacity="0.5"/>
  </g>

  <!-- Arms holding controller -->
  <path d="M130 310c-20 15-35 40-30 60" stroke="#ffe0f0" stroke-width="18" stroke-linecap="round" fill="none"/>
  <path d="M270 310c20 15 35 40 30 60" stroke="#ffe0f0" stroke-width="18" stroke-linecap="round" fill="none"/>

  <!-- Sparkles -->
  <g fill="#c77dff" opacity="0.5">
    <path d="M60 120l3 6 6 3-6 3-3 6-3-6-6-3 6-3z"/>
    <path d="M340 100l2 4 4 2-4 2-2 4-2-4-4-2 4-2z"/>
    <path d="M80 400l2.5 5 5 2.5-5 2.5-2.5 5-2.5-5-5-2.5 5-2.5z"/>
  </g>
</svg>
