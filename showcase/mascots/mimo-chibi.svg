<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 280" fill="none">
  <defs>
    <linearGradient id="ch" x1="0.3" y1="0" x2="0.7" y2="1">
      <stop offset="0%" stop-color="#ffccee"/>
      <stop offset="50%" stop-color="#ff9ed2"/>
      <stop offset="100%" stop-color="#ff6eb4"/>
