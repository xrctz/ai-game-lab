<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 450" role="img" aria-label="Dead Zone Evacuation preview">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a1028"/>
      <stop offset="55%" stop-color="#141c3a"/>
      <stop offset="100%" stop-color="#1a0f12"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#35e7ff"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="720" height="450" fill="url(#sky)"/>
  <rect y="300" width="720" height="150" fill="#0d1118"/>
  <!-- city blocks -->
  <g fill="#1e2848" opacity=".95">
    <rect x="40" y="120" width="90" height="200"/><rect x="150" y="80" width="70" height="240"/>
    <rect x="240" y="140" width="110" height="180"/><rect x="380" y="60" width="85" height="260"/>
    <rect x="490" y="100" width="95" height="220"/><rect x="610" y="130" width="70" height="190"/>
  </g>
  <!-- neon signs -->
  <rect x="255" y="200" width="80" height="14" rx="3" fill="#ff4d6d" opacity=".85"/>
  <rect x="400" y="170" width="60" height="12" rx="3" fill="#35e7ff" opacity=".9"/>
  <rect x="520" y="210" width="70" height="12" rx="3" fill="#7cff6b" opacity=".75"/>
  <!-- street -->
  <rect x="0" y="295" width="720" height="28" fill="#252d42"/>
  <g stroke="#3d4a66" stroke-width="2" stroke-dasharray="18 14" opacity=".6">
    <line x1="0" y1="309" x2="720" y2="309"/>
  </g>
  <!-- title -->
  <text x="360" y="370" text-anchor="middle" font-family="Orbitron,Segoe UI,sans-serif" font-size="42" font-weight="800" fill="url(#neon)" filter="url(#glow)">DEAD ZONE</text>
  <text x="360" y="408" text-anchor="middle" font-family="Inter,Segoe UI,sans-serif" font-size="18" letter-spacing="12" fill="#9fb0d8">EVACUATION</text>
  <text x="360" y="432" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="11" fill="#5a6588">3D SQUAD FPS · TWO MAPS · 15 WAVES</text>
</svg>
